<div class="container mt-4">
    <h1 class="mb-4 fw-bold text-primary">Equipos</h1>

    <!-- Contenedor en rejilla de Bootstrap -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        @for (team of equipos; track team) {
        <div class="col">
            <!-- Añadimos la clase team-card aquí -->
            <div class="card h-100 shadow-sm border-0 team-card">
                <div class="bg-light p-3 d-flex align-items-center justify-content-center" style="height: 200px;">
                    <img [src]="team.imagen" class="img-fluid" alt="..." style="max-height: 100%; object-fit: contain;">
                </div>

                <div class="card-body text-center">
                    <h5 class="card-title fw-bold text-dark">{{team.nombre}}</h5>
                    <p class="card-text text-muted">
                        <i class="bi bi-trophy-fill text-warning me-1"></i> Champions: {{team.champions}}
                    </p>
                </div>
            </div>
        </div>
        }
    </div>
</div>
